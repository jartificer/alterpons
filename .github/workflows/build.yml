name: Automated builds

on:
  push:
    branches:
      - '**'
    tags:
      # Run when pushing version tags, since otherwise it's impossible to
      # restart a successful build after pushing a tag
      - '*.*.*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

defaults:
  run:
    # This otherwise gets run under dash which does not support brace expansion
    shell: bash

jobs:
  build:
    name: Build on Ubuntu 24.04
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ env.ARCHIVE_NAME }}
    steps:
      - uses: actions/checkout@v4
      # Needed for git-describe to do anything useful
      - name: Fetch all git history
        run: git fetch --force --prune --tags --unshallow
      - name: Determine build archive name
        run: |
          echo "ARCHIVE_NAME=yabridge-$(git describe --always).tar.gz" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build cmake pkg-config g++ \
            libxcb1-dev libdbus-1-dev \
            wine64 wine32:i386 wine64-tools libwine-dev \
            g++-mingw-w64-i686-posix g++-mingw-w64-x86-64-posix \
            xvfb
      - name: Build the native libraries and the 64-bit plugin host
        run: |
          meson setup build --buildtype=release --cross-file=cross-wine.conf --unity=on --unity-size=10000
          ninja -C build
      - name: Build the 32-bit plugin host
        run: |
          meson setup build-32 --buildtype=release --cross-file=cross-mingw-i686-posix.conf --unity=on --unity-size=10000
          ninja -C build-32
      - name: Run the smoke test
        env:
          MINGW_SUFFIX: -posix
        run: xvfb-run -a tools/smoke-test/run-smoke-test.sh build build-32
      - name: Strip remaining debug symbols
        run: |
          strip build/libyabridge{,-chainloader}-{clap,vst2,vst3}.so build/yabridge-host.exe.so
          i686-w64-mingw32-strip build-32/yabridge-host-32.exe
      - name: Create an archive for the binaries
        run: |
          mkdir yabridge
          cp build/libyabridge{,-chainloader}-{clap,vst2,vst3}.so build/yabridge-host.exe{,.so} build-32/yabridge-host-32.exe yabridge
          cp CHANGELOG.md README.md yabridge

          tar -caf "$ARCHIVE_NAME" yabridge
          rm -rf yabridge
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  build-yabridgectl:
    name: Build yabridgectl
    runs-on: ubuntu-latest
    container: robbert/docker-yabridge:focal
    outputs:
      artifact-name: ${{ env.ARCHIVE_NAME }}
    defaults:
      run:
        working-directory: tools/yabridgectl
    steps:
      - uses: actions/checkout@v7
      # Needed for git-describe to do anything useful, the safe directory
      # workaround is needed for https://github.com/actions/runner/issues/2033
      - name: Fetch all git history
        run: |
          git config --global --add safe.directory /__w/yabridge/yabridge
          git fetch --force --prune --tags --unshallow
      - name: Determine build archive name
        run: |
          echo "ARCHIVE_NAME=yabridgectl-$(git describe --always).tar.gz" >> "$GITHUB_ENV"
        # FIXME: Needed as long as we use the docker image
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build the binaries
        run: cargo build --release
      - name: Strip remaining debug symbols
        run: strip target/release/yabridgectl
      - name: Create an archive for the binaries
        run: |
          mkdir yabridgectl
          cp target/release/yabridgectl README.md yabridgectl

          tar -caf "$ARCHIVE_NAME" yabridgectl
          rm -rf yabridgectl
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          # For some reason there's no way to tell GitHub actions to run actions
          # in a subdirectory
          path: tools/yabridgectl/${{ env.ARCHIVE_NAME }}
