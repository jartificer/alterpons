# Cross file for building the 32-bit Wine plugin host (`yabridge-host-32.exe`)
# as a regular 32-bit Windows executable using MinGW-w64. This is needed for
# using 32-bit Windows plugins with Wine's (new) WoW64 mode, which is what
# Arch Linux' `wine` and `wine-staging` packages use. See the readme for more
# information.
#
# On Arch Linux the compilers below are provided by the `mingw-w64-gcc`
# package. On Debian and Ubuntu, install `g++-mingw-w64-i686-posix` and use
# `cross-mingw-i686-posix.conf` instead, or select the POSIX threading model
# using `update-alternatives`. The win32 threading model does not support
# `std::thread`.

[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
# Only used to find native dependencies like the libxcb headers
pkg-config = 'pkg-config'
cmake = 'cmake'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
