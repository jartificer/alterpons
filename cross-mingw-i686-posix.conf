# The same as `cross-mingw-i686.conf`, but using the explicit `-posix` compiler
# variants used on Debian and Ubuntu (`g++-mingw-w64-i686-posix`).

[binaries]
c = 'i686-w64-mingw32-gcc-posix'
cpp = 'i686-w64-mingw32-g++-posix'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
pkg-config = 'pkg-config'
cmake = 'cmake'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
